openapi: 3.0.3
info:
  title: Roombook API
  version: 1.0.0
  description: A small meeting-room booking API.
servers:
  - url: http://localhost:3001
paths:
  /api/health:
    get:
      summary: Liveness check
      responses:
        '200':
          description: The API is up.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
  /api/rooms:
    get:
      summary: List rooms by floor, then name
      parameters:
        - name: q
          in: query
          description: Only rooms whose name contains this text, ignoring case.
          schema: { type: string, minLength: 1, maxLength: 50 }
      responses:
        '200':
          description: The matching rooms.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Room' }
        '400': { $ref: '#/components/responses/Error' }
  /api/rooms/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      summary: Get one room
      responses:
        '200':
          description: The room.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Room' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/rooms/{id}/availability:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      - { name: date, in: query, required: true, schema: { type: string, format: date } }
    get:
      summary: A room's bookings and free slots for one day (08:00 to 18:00 UTC)
      responses:
        '200':
          description: The room's day.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Availability' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/bookings:
    get:
      summary: List bookings by start time
      parameters:
        - { name: roomId, in: query, schema: { type: integer, minimum: 1 } }
        - { name: date, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: The matching bookings.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Booking' }
        '400': { $ref: '#/components/responses/Error' }
    post:
      summary: Book a room for the acting member
      parameters:
        - { $ref: '#/components/parameters/MemberId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roomId, title, startsAt, endsAt]
              properties:
                roomId: { type: integer, minimum: 1 }
                title: { type: string, minLength: 1, maxLength: 120 }
                startsAt: { type: string, format: date-time }
                endsAt: { type: string, format: date-time }
      responses:
        '201':
          description: The new booking.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/bookings/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    delete:
      summary: Cancel a booking
      parameters:
        - { $ref: '#/components/parameters/MemberId' }
      responses:
        '204':
          description: The booking was cancelled.
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
components:
  parameters:
    MemberId:
      name: X-Member-Id
      in: header
      required: true
      description: The id of the member making the request.
      schema: { type: integer, minimum: 1 }
  responses:
    Error:
      description: The request failed.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: { type: string }
  schemas:
    Room:
      type: object
      required: [id, name, floor, capacity]
      properties:
        id: { type: integer }
        name: { type: string }
        floor: { type: integer }
        capacity: { type: integer, minimum: 1 }
    Booking:
      type: object
      required: [id, roomId, memberId, title, startsAt, endsAt, createdAt]
      properties:
        id: { type: integer }
        roomId: { type: integer }
        memberId: { type: integer }
        title: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    FreeSlot:
      type: object
      required: [startsAt, endsAt]
      properties:
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
    Availability:
      type: object
      required: [roomId, date, bookings, free]
      properties:
        roomId: { type: integer }
        date: { type: string, format: date }
        bookings:
          type: array
          items: { $ref: '#/components/schemas/Booking' }
        free:
          type: array
          items: { $ref: '#/components/schemas/FreeSlot' }
